name: MYR
description: MYR (formerly Koomi) is a cloud-based point-of-sale (POS) platform built for quick-service
  restaurants (QSRs) across North America, serving 1,500+ locations including coffee shops, food trucks,
  burger joints, pizzerias, sushi shops and bubble tea shops. The all-in-one system handles order
  processing across in-store, online-ordering and delivery channels, inventory management, digital
  loyalty programs, real-time reporting and hardware (iPads, payment terminals, receipt printers). MYR
  ships pre-built integrations with delivery marketplaces (Uber Eats, DoorDash, Grubhub, Skip, Ritual),
  accounting (QuickBooks Online, Wave, Sage, Acumatica), scheduling (7shifts), inventory (WISK) and
  loyalty/gift-card platforms (DataCandy). It does not publish a public developer program or API at this
  time; the merchant back office runs at admin.koomi.com.
